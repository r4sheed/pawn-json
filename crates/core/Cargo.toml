[package]
name = "pawn-json-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
indexmap = "2"
rustc-hash = "2"
encoding_rs = "0.8"
itoa = "1"
zmij = "1"
serde = "1"
serde_json = "1"

[dev-dependencies]
# The float notation files have always had; the tests hold the writer to it.
ryu = "1"
# The speed checks run on the allocator the component ships with.
mimalloc = { version = "0.1", default-features = false }
