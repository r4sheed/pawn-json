[package]
name = "pawn-json"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "pawn_json"
crate-type = ["cdylib"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
pawn-json-core = { path = "../core" }
rustc-hash = "2"

[dev-dependencies]
# Random scripts for the model test in src/model.rs.
proptest = "1"

[build-dependencies]
cc = "1"
